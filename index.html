<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect Parameter Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 350px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #005F9E;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #004573;
        }
        #result-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #f1f1f1;
            border-left: 4px solid #005F9E;
            word-break: break-all;
            min-height: 40px;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        .result-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status" id="status-text">Connecting to Trimble Connect...</div>
    
    <label for="paramName">IFC Parameter Name:</label>
    <input type="text" id="paramName" placeholder="e.g. Volume, Reference, etc.">
    
    <button id="getValueBtn">Get Parameter Value</button>
    
    <div id="result-box">Select elements and search...</div>
</div>

<!-- Using esm.sh to load the Workspace API natively in the browser -->
<script type="module">
    import * as WorkspaceAPI from 'https://esm.sh/trimble-connect-workspace-api';

    let tcAPI = null;

    // 1. Connect to the parent Trimble Connect window
    async function initExtension() {
        try {
            tcAPI = await WorkspaceAPI.connect(window.parent, (event, args) => {
                // Event listener for parent window interactions (optional)
            });
            document.getElementById('status-text').innerText = "✅ API Connected";
            document.getElementById('status-text').style.color = "green";
        } catch (error) {
            console.error("Failed to connect to Trimble Connect", error);
            document.getElementById('status-text').innerText = "❌ Connection Failed";
            document.getElementById('status-text').style.color = "red";
        }
    }

    // 2. Recursive function to find the parameter inside deep IFC Property Sets
    function findParameterValue(propertiesData, paramName) {
        let foundValue = null;
        const targetName = paramName.toLowerCase();

        const searchObj = (obj) => {
            if (foundValue !== null) return;
            if (typeof obj !== 'object' || obj === null) return;

            // Handle array-based {name: "Volume", value: 10} formats
            if (obj.name && String(obj.name).toLowerCase() === targetName && obj.value !== undefined) {
                foundValue = obj.value;
                return;
            }

            // Handle direct Key-Value pair formats
            for (const key in obj) {
                if (key.toLowerCase() === targetName) {
                    foundValue = obj[key];
                    return;
                }
                if (typeof obj[key] === 'object') {
                    searchObj(obj[key]);
                }
            }
        };

        searchObj(propertiesData);
        return foundValue;
    }

    // 3. Handle Button Click
    document.getElementById('getValueBtn').addEventListener('click', async () => {
        const resultBox = document.getElementById('result-box');
        
        if (!tcAPI) {
            resultBox.innerText = "Error: API not connected.";
            return;
        }

        const paramName = document.getElementById('paramName').value.trim();
        if (!paramName) {
            resultBox.innerText = "Please type a parameter name.";
            return;
        }

        resultBox.innerText = "Fetching data...";

        try {
            // Get selected objects from the 3D Viewer
            const selection = await tcAPI.viewer.getSelection();
            
            // Check if nothing is selected
            if (!selection || selection.length === 0 || selection.every(sel => sel.objectRuntimeIds.length === 0)) {
                resultBox.innerText = "No objects selected. Please click elements in the 3D viewer.";
                return;
            }

            resultBox.innerHTML = `<strong>Results for "${paramName}":</strong><br><br>`;

            // Loop through all selected models
            for (const sel of selection) {
                const modelId = sel.modelId;
                
                // Only process if there are objects selected in this particular model
                if (sel.objectRuntimeIds && sel.objectRuntimeIds.length > 0) {
                    // Fetch properties for all selected objects in this model at once
                    const propertiesList = await tcAPI.viewer.getObjectProperties(modelId, sel.objectRuntimeIds);
                    
                    if (propertiesList && propertiesList.length > 0) {
                        propertiesList.forEach((objectData, index) => {
                            const value = findParameterValue(objectData, paramName);
                            const elementId = sel.objectRuntimeIds[index];

                            if (value !== null && value !== undefined) {
                                resultBox.innerHTML += `<div class="result-item"><strong>ID ${elementId}:</strong> ${value}</div>`;
                            } else {
                                resultBox.innerHTML += `<div class="result-item"><strong>ID ${elementId}:</strong> <span style="color:red">Not found</span></div>`;
                            }
                        });
                    }
                }
            }

        } catch (error) {
            console.error("API Error:", error);
            resultBox.innerText = "Error fetching properties. Check the developer console.";
        }
    });

    // Initialize as soon as the DOM loads
    window.onload = initExtension;
</script>

</body>
</html>
