<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4D Construction Sequence Simulator</title>
  <!--
    Official IIFE. The old unpkg URL (@trimble/workspace-api) 404s, which left
    viewer === null and made Load Data show "Viewer is not connected yet."
  -->
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  <style>
    :root {
      --bg: #0f1720;
      --panel: #17202b;
      --panel-2: #1d2836;
      --border: #2b3b4d;
      --text: #e8eef5;
      --muted: #93a4b8;
      --accent: #1a8cff;
      --accent-2: #0ea5e9;
      --good: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 0% 0%, #1b2d44 0%, var(--bg) 55%);
      color: var(--text);
    }

    .app {
      min-height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      background: #0d141c;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="range"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26, 140, 255, 0.2);
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 650;
      cursor: pointer;
      color: #fff;
      background: #334155;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary { background: linear-gradient(180deg, var(--accent) 0%, #1066c7 100%); flex: 1; }
    .btn-play { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); flex: 1; }
    .btn-pause { background: linear-gradient(180deg, #d97706 0%, #b45309 100%); flex: 1; }
    .btn-reset { background: linear-gradient(180deg, #64748b 0%, #475569 100%); flex: 1; }

    .phase-box {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .phase-value {
      font-size: 28px;
      font-weight: 750;
      color: #7dd3fc;
    }

    .meta {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error { color: #fca5a5; }
    .status.ok { color: #86efac; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-2);
    }

    .speed-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .progress {
      height: 6px;
      background: #0d141c;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-2), #22c55e);
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>4D Sequence Simulator</h1>
      <div class="subtitle">Trimble Connect 3D Viewer side-panel extension</div>
    </header>

    <section class="card">
      <label for="parameterName">Parameter Name</label>
      <input id="parameterName" type="text" value="ORDER" autocomplete="off" />
      <div class="row" style="margin-top: 10px;">
        <button id="loadBtn" class="btn-primary" type="button">Load Data</button>
      </div>
      <div id="loadMeta" class="meta">Connect to the viewer, then load objects grouped by the parameter above.</div>
    </section>

    <section class="card">
      <div class="phase-box">
        <div>
          <label>Current Phase</label>
          <div class="phase-value" id="currentPhase">—</div>
        </div>
        <div class="status" id="playbackStatus">Idle</div>
      </div>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    </section>

    <section class="card">
      <label>Playback</label>
      <div class="row">
        <button id="playBtn" class="btn-play" type="button" disabled>Play</button>
        <button id="pauseBtn" class="btn-pause" type="button" disabled>Pause</button>
        <button id="resetBtn" class="btn-reset" type="button" disabled>Reset</button>
      </div>
    </section>

    <section class="card">
      <label for="speedSlider">Playback Speed</label>
      <input id="speedSlider" type="range" min="0.5" max="3" step="0.1" value="1" />
      <div class="speed-row">
        <span>0.5 s / step</span>
        <span id="speedLabel">1.0 s / step</span>
        <span>3.0 s / step</span>
      </div>
    </section>

    <div id="status" class="status">Initializing Workspace API…</div>
  </div>

  <script>
    /**
     * 4D Construction Sequence Simulator
     * ---------------------------------
     * Groups 3D objects by a named property (default: "ORDER"), ghosts the
     * whole model, then restores objects phase-by-phase to simulate construction.
     */

    // ----- DOM -----
    const parameterInput = document.getElementById("parameterName");
    const loadBtn = document.getElementById("loadBtn");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const speedSlider = document.getElementById("speedSlider");
    const speedLabel = document.getElementById("speedLabel");
    const currentPhaseEl = document.getElementById("currentPhase");
    const loadMeta = document.getElementById("loadMeta");
    const statusEl = document.getElementById("status");
    const playbackStatus = document.getElementById("playbackStatus");
    const progressBar = document.getElementById("progressBar");

    // ----- Runtime state -----
    let workspace = null;
    let viewer = null;
    /** @type {{ key: string, numeric: number, byModel: { modelId: string, objectRuntimeIds: number[] }[] }[]} */
    let sortedPhases = [];
    let currentIndex = 0;
    let intervalId = null;
    let hasGhosted = false;
    let isPlaying = false;

    const GHOST_COLOR = { r: 190, g: 196, b: 204, a: 51 }; // light grey, ~20% alpha (0–255)
    const GHOST_OPACITY = 0.2;
    const SOLID_COLOR = { r: 46, g: 125, b: 246, a: 255 }; // opaque if original color is unknown
    const PROPERTY_BATCH_SIZE = 200;
    const STATE_BATCH_SIZE = 250;
    /** @type {Map<string, string | {r:number,g:number,b:number,a:number}>} */
    const originalColors = new Map();
    /** @type {Set<string>} */
    const matchedPropertyNames = new Set();

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function setPlaybackStatus(message) {
      playbackStatus.textContent = message;
    }

    function updateSpeedLabel() {
      const seconds = Number(speedSlider.value);
      speedLabel.textContent = seconds.toFixed(1) + " s / step";
    }

    function updatePhaseUi() {
      if (!sortedPhases.length) {
        currentPhaseEl.textContent = "—";
        progressBar.style.width = "0%";
        return;
      }
      if (currentIndex <= 0) {
        currentPhaseEl.textContent = "—";
        progressBar.style.width = "0%";
        return;
      }
      const phase = sortedPhases[currentIndex - 1];
      currentPhaseEl.textContent = String(phase.key);
      progressBar.style.width = ((currentIndex / sortedPhases.length) * 100).toFixed(1) + "%";
    }

    function setControlsEnabled(loaded) {
      playBtn.disabled = !loaded;
      pauseBtn.disabled = !loaded || !isPlaying;
      resetBtn.disabled = !loaded;
    }

    /**
     * Official IIFE global is TrimbleConnectWorkspace.
     * Also accept WorkspaceAPI / TrimbleWorkspaceAPI if a different bundle loads.
     */
    function resolveConnectFn() {
      const candidates = [
        window.TrimbleConnectWorkspace,
        window.WorkspaceAPI,
        window.TrimbleWorkspaceAPI,
        window.trimbleConnectWorkspaceApi
      ];
      for (const api of candidates) {
        if (api && typeof api.connect === "function") return api.connect.bind(api);
      }
      return null;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector('script[src="' + src + '"]');
        if (existing && resolveConnectFn()) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Failed to load " + src));
        document.head.appendChild(script);
      });
    }

    async function ensureApiScript() {
      if (resolveConnectFn()) return;
      const sources = [
        "https://components.connect.trimble.com/trimble-connect-workspace-api/index.js",
        "https://unpkg.com/trimble-connect-workspace-api/dist/iife/trimbleconnect.workspace.api.js"
      ];
      let lastError = null;
      for (const src of sources) {
        try {
          await loadScript(src);
          if (resolveConnectFn()) return;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Workspace API script did not expose connect().");
    }

    function onWorkspaceEvent(event, data) {
      console.debug("[WorkspaceAPI event]", event, data);
    }

    function connectionTargets() {
      const targets = [];
      if (window.parent && window.parent !== window) targets.push(window.parent);
      if (window.top && window.top !== window && window.top !== window.parent) {
        targets.push(window.top);
      }
      return targets;
    }

    async function connectToViewer() {
      await ensureApiScript();
      const connect = resolveConnectFn();
      if (!connect) {
        throw new Error("Workspace API loaded, but connect() was not found.");
      }

      const targets = connectionTargets();
      if (!targets.length) {
        throw new Error(
          "This page is not inside Trimble Connect. Open it from the 3D Viewer side panel, not as a GitHub Pages tab."
        );
      }

      let lastError = null;
      for (const target of targets) {
        try {
          // Official: TrimbleConnectWorkspace.connect(window.parent, onEvent, timeoutMs)
          const api = await connect(target, onWorkspaceEvent, 30000);
          const nextViewer = api && (api.viewer || (api.api && api.api.viewer));
          if (!nextViewer) {
            throw new Error("Connected, but the viewer API is missing. Open a 3D model first.");
          }
          workspace = api;
          viewer = nextViewer;
          return;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Could not connect to the 3D Viewer.");
    }

    async function initialize() {
      try {
        await connectToViewer();
        setStatus("Connected to Trimble Connect 3D Viewer.", "ok");
      } catch (err) {
        console.error(err);
        setStatus("Could not connect to the viewer: " + err.message, "error");
      }
    }

    /**
     * PROPERTY FETCHING — ADJUST HERE IF THE API RESPONSE SHAPE DIFFERS
     * ----------------------------------------------------------------
     * Official ViewerAPI:
     *   getObjects(selector?, objectState?) -> ModelObjects[]
     *     ModelObjects = { modelId: string, objects: ObjectProperties[] }
     *     ObjectProperties = { id: number, color?, properties?: PropertySet[] }
     *
     *   getObjectProperties(modelId, objectRuntimeIds) -> ObjectProperties[]
     *
     *   PropertySet = { name?: string, properties?: Property[] }
     *   Property    = { name: string, type, value: string | number }
     *
     * getObjects() often returns IDs only (no nested properties). This loader
     * therefore:
     *   1) lists objects per model via getObjects()
     *   2) hydrates properties via getObjectProperties() in batches
     *
     * Trimble uses *original model property names*, which may differ from the
     * formatted names shown in the Connect UI (e.g. "ORDER" vs
     * "IfcBuildingElement.ORDER"). The matcher below is case-insensitive and
     * also accepts names that end with ".ORDER".
     *
     * If your tenant returns a flatter structure, tweak extractParameterMatch().
     */
    function extractParameterMatch(objectProperties, parameterName) {
      const wanted = parameterName.trim().toLowerCase();
      if (!wanted) return null;

      const propsRoot = objectProperties && objectProperties.properties;
      if (!propsRoot) return null;

      // Some SDK versions return PropertySet[]; others may return a flat map.
      if (!Array.isArray(propsRoot) && typeof propsRoot === "object") {
        for (const [key, value] of Object.entries(propsRoot)) {
          if (propertyNameMatches(key, wanted)) {
            const normalized = normalizeValue(value);
            return normalized == null ? null : { value: normalized, name: key };
          }
        }
        return null;
      }

      for (const set of propsRoot) {
        if (set && propertyNameMatches(set.name, wanted) && set.value != null) {
          const normalized = normalizeValue(set.value);
          if (normalized != null) return { value: normalized, name: set.name };
        }
        const inner = (set && set.properties) || [];
        for (const prop of inner) {
          if (!prop) continue;
          if (propertyNameMatches(prop.name, wanted)) {
            const normalized = normalizeValue(prop.value);
            if (normalized != null) return { value: normalized, name: prop.name };
          }
        }
      }
      return null;
    }

    function propertyNameMatches(actualName, wantedLower) {
      if (!actualName) return false;
      const actual = String(actualName).toLowerCase();
      return actual === wantedLower || actual.endsWith("." + wantedLower);
    }

    function normalizeValue(value) {
      if (value == null) return null;
      if (typeof value === "object") {
        if ("value" in value) return String(value.value);
        return JSON.stringify(value);
      }
      return String(value);
    }

    function toNumericSortKey(raw) {
      const n = Number(raw);
      return Number.isFinite(n) ? n : Number.POSITIVE_INFINITY;
    }

    async function getAllModelObjects() {
      // Empty selector => all loaded objects.
      if (typeof viewer.getObjects === "function") {
        const models = await viewer.getObjects();
        if (Array.isArray(models)) return models;
      }
      throw new Error("viewer.getObjects() is not available on this API build.");
    }

    async function getPropertiesForIds(modelId, objectRuntimeIds) {
      const getter =
        (typeof viewer.getObjectProperties === "function" && viewer.getObjectProperties.bind(viewer)) ||
        (typeof viewer.getProperties === "function" && viewer.getProperties.bind(viewer));

      if (!getter) {
        throw new Error(
          "Neither viewer.getObjectProperties nor viewer.getProperties exists. " +
          "Inspect workspace.viewer and update this function."
        );
      }

      const results = [];
      for (let i = 0; i < objectRuntimeIds.length; i += PROPERTY_BATCH_SIZE) {
        const batch = objectRuntimeIds.slice(i, i + PROPERTY_BATCH_SIZE);
        const props = await getter(modelId, batch);
        if (Array.isArray(props)) results.push(...props);
      }
      return results;
    }

    function toRuntimeId(value) {
      if (typeof value === "number" && Number.isFinite(value)) return value;
      if (typeof value === "string" && value.trim() !== "") {
        const n = Number(value);
        if (Number.isFinite(n)) return n;
      }
      return null;
    }

    function collectRuntimeIds(modelEntry) {
      const objects = modelEntry.objects || modelEntry.objectRuntimeIds || [];
      if (!Array.isArray(objects)) return [];
      if (objects.length && (typeof objects[0] === "number" || typeof objects[0] === "string")) {
        return objects.map(toRuntimeId).filter((id) => id != null);
      }
      return objects
        .map((obj) => obj && toRuntimeId(obj.id ?? obj.runtimeId ?? obj.objectRuntimeId))
        .filter((id) => id != null);
    }

    function colorKey(modelId, runtimeId) {
      return modelId + ":" + runtimeId;
    }

    async function loadData() {
      if (!viewer) {
        setStatus("Connecting to the 3D Viewer…");
        try {
          await connectToViewer();
          setStatus("Connected to Trimble Connect 3D Viewer.", "ok");
        } catch (err) {
          console.error(err);
          setStatus("Viewer is not connected yet. " + err.message, "error");
          return;
        }
      }

      const parameterName = parameterInput.value.trim();
      if (!parameterName) {
        setStatus("Enter a parameter name first.", "error");
        return;
      }

      stopInterval();
      hasGhosted = false;
      currentIndex = 0;
      sortedPhases = [];
      updatePhaseUi();
      setControlsEnabled(false);
      loadBtn.disabled = true;
      setStatus("Loading objects and properties…");

      try {
        const models = await getAllModelObjects();
        if (!models.length) {
          throw new Error("No objects were returned. Load a 3D model in the viewer first.");
        }

        originalColors.clear();
        matchedPropertyNames.clear();
        matchedPropertyNames.add(parameterName);

        /** @type {Map<string, Map<string, number[]>>} phaseKey -> modelId -> ids */
        const grouped = new Map();
        let scanned = 0;
        let matched = 0;

        for (const model of models) {
          const modelId = model.modelId || model.id;
          if (!modelId) continue;

          const runtimeIds = collectRuntimeIds(model);
          scanned += runtimeIds.length;
          if (!runtimeIds.length) continue;

          const propList = await getPropertiesForIds(modelId, runtimeIds);
          const byId = new Map();
          for (const item of propList) {
            const id = toRuntimeId(item.id ?? item.runtimeId);
            if (id != null) byId.set(id, item);
          }

          for (const runtimeId of runtimeIds) {
            const props = byId.get(runtimeId) || {};
            const match = extractParameterMatch(props, parameterName);
            if (!match) continue;
            matched += 1;
            if (match.name) matchedPropertyNames.add(match.name);
            if (props.color) originalColors.set(colorKey(modelId, runtimeId), props.color);

            if (!grouped.has(match.value)) grouped.set(match.value, new Map());
            const perModel = grouped.get(match.value);
            if (!perModel.has(modelId)) perModel.set(modelId, []);
            perModel.get(modelId).push(runtimeId);
          }
        }

        sortedPhases = Array.from(grouped.entries())
          .map(([key, perModel]) => ({
            key,
            numeric: toNumericSortKey(key),
            byModel: Array.from(perModel.entries()).map(([modelId, objectRuntimeIds]) => ({
              modelId,
              objectRuntimeIds
            }))
          }))
          .sort((a, b) => {
            if (a.numeric !== b.numeric) return a.numeric - b.numeric;
            return String(a.key).localeCompare(String(b.key), undefined, { numeric: true });
          });

        loadMeta.textContent =
          "Scanned " + scanned + " objects · matched " + matched +
          " with \"" + parameterName + "\" · " + sortedPhases.length + " phases.";

        if (!sortedPhases.length) {
          setStatus(
            "No objects had that parameter. Try the original model property name " +
            "(Connect UI names are often reformatted).",
            "error"
          );
          setControlsEnabled(false);
          return;
        }

        currentIndex = 0;
        updatePhaseUi();
        setControlsEnabled(true);
        setPlaybackStatus("Ready");
        setStatus("Data loaded. Press Play to start the sequence.", "ok");
      } catch (err) {
        console.error(err);
        setStatus("Load failed: " + err.message, "error");
      } finally {
        loadBtn.disabled = false;
      }
    }

    /**
     * COLOR / OPACITY
     * ---------------
     * Working SDK samples pass a flat selector:
     *   { modelId, objectRuntimeIds }
     * Official ObjectSelector wraps that as:
     *   { modelObjectIds: [{ modelId, objectRuntimeIds }] }
     * Ghosting with `undefined` works. Revealing with only the wrapped form
     * often matches nothing, so objects stay ghosted while the UI still ticks.
     *
     * Do not rely on color: "reset" for the sequence — it frequently leaves
     * the previous ghost color in place. Reveal with an opaque color instead.
     */
    async function applyState(selector, objectState) {
      await viewer.setObjectState(selector, objectState);
    }

    function revealStateForIds(modelId, ids) {
      const firstColor = ids
        .map((id) => originalColors.get(colorKey(modelId, id)))
        .find(Boolean);
      return {
        visible: true,
        opacity: 1,
        color: firstColor || SOLID_COLOR
      };
    }

    async function applyStateToIds(modelId, ids, objectState) {
      const objectRuntimeIds = ids.map(toRuntimeId).filter((id) => id != null);
      if (!objectRuntimeIds.length) return;

      for (let i = 0; i < objectRuntimeIds.length; i += STATE_BATCH_SIZE) {
        const batch = objectRuntimeIds.slice(i, i + STATE_BATCH_SIZE);
        // Format used by Trimble samples / setSelection / setCamera
        await applyState(
          { modelId: modelId, objectRuntimeIds: batch, recursive: true },
          objectState
        );
        // Official ObjectSelector shape
        await applyState(
          { modelObjectIds: [{ modelId: modelId, objectRuntimeIds: batch, recursive: true }] },
          objectState
        );
      }
    }

    async function applyStateByParameter(parameterName, rawValue, objectState) {
      const names = new Set(matchedPropertyNames);
      names.add(parameterName);
      const values = [rawValue];
      const numeric = Number(rawValue);
      if (Number.isFinite(numeric)) values.push(numeric);

      for (const name of names) {
        for (const value of values) {
          try {
            await applyState(
              { parameter: { properties: { [name]: value } } },
              objectState
            );
          } catch (err) {
            console.debug("parameter selector skipped", name, value, err);
          }
        }
      }
    }

    async function ghostEntireModel() {
      await applyState(undefined, {
        color: GHOST_COLOR,
        opacity: GHOST_OPACITY,
        visible: true
      });
      hasGhosted = true;
    }

    async function restorePhase(phase) {
      const parameterName = parameterInput.value.trim() || "ORDER";
      for (const group of phase.byModel) {
        const state = revealStateForIds(group.modelId, group.objectRuntimeIds);
        await applyStateToIds(group.modelId, group.objectRuntimeIds, state);
      }
      await applyStateByParameter(parameterName, phase.key, {
        visible: true,
        opacity: 1,
        color: SOLID_COLOR
      });
    }

    async function restoreAllObjects() {
      await applyState(undefined, { color: "reset", opacity: 1, visible: "reset" });
      hasGhosted = false;
    }

    function stopPlaybackTimer() {
      if (intervalId != null) {
        clearTimeout(intervalId);
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    function stopInterval() {
      stopPlaybackTimer();
      isPlaying = false;
      pauseBtn.disabled = true;
    }

    function waitForSpeed() {
      const ms = Number(speedSlider.value) * 1000;
      return new Promise((resolve) => {
        intervalId = setTimeout(resolve, ms);
      });
    }

    async function stepOnce() {
      if (currentIndex >= sortedPhases.length) {
        stopInterval();
        setPlaybackStatus("Complete");
        setStatus("Sequence finished. Reset to play again.", "ok");
        return;
      }

      const phase = sortedPhases[currentIndex];
      const objectCount = phase.byModel.reduce(
        (sum, group) => sum + (group.objectRuntimeIds ? group.objectRuntimeIds.length : 0),
        0
      );
      setStatus("Revealing ORDER " + phase.key + " (" + objectCount + " objects)…");
      try {
        await restorePhase(phase);
        currentIndex += 1;
        updatePhaseUi();
        setPlaybackStatus("Playing");
      } catch (err) {
        console.error(err);
        stopInterval();
        setStatus("Playback failed: " + err.message, "error");
      }
    }

    async function play() {
      if (!sortedPhases.length) return;
      if (isPlaying) return;

      playBtn.disabled = true;
      try {
        if (currentIndex >= sortedPhases.length) {
          await restoreAllObjects();
          currentIndex = 0;
          updatePhaseUi();
        }

        if (!hasGhosted) {
          setStatus("Ghosting the model…");
          await ghostEntireModel();
        }

        isPlaying = true;
        pauseBtn.disabled = false;
        resetBtn.disabled = false;
        setPlaybackStatus("Playing");
        setStatus("Playing construction sequence.", "ok");

        await stepOnce();
        while (isPlaying && currentIndex < sortedPhases.length) {
          await waitForSpeed();
          if (!isPlaying) break;
          await stepOnce();
        }
      } catch (err) {
        console.error(err);
        stopInterval();
        setStatus("Could not start playback: " + err.message, "error");
      } finally {
        playBtn.disabled = !sortedPhases.length;
      }
    }

    function pause() {
      stopInterval();
      setPlaybackStatus("Paused");
      setStatus("Paused at phase " + (currentPhaseEl.textContent || "—") + ".");
    }

    async function reset() {
      stopInterval();
      currentIndex = 0;
      updatePhaseUi();
      setPlaybackStatus("Resetting");
      try {
        await restoreAllObjects();
        setPlaybackStatus("Ready");
        setStatus("Model restored to original colors.", "ok");
      } catch (err) {
        console.error(err);
        setStatus("Reset failed: " + err.message, "error");
      }
    }

    speedSlider.addEventListener("input", () => {
      updateSpeedLabel();
    });

    loadBtn.addEventListener("click", loadData);
    playBtn.addEventListener("click", play);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);

    updateSpeedLabel();
    initialize();
  </script>
</body>
</html>
