<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Sequence Simulation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 350px;
        }
        label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .btn-main { width: 100%; padding: 10px; background-color: #005F9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-bottom: 10px;}
        .btn-main:hover { background-color: #004573; }
        .btn-main:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-sim { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; color: white; }
        #btn-simulate { background-color: #28a745; }
        #btn-simulate:hover { background-color: #218838; }
        #btn-reset { background-color: #dc3545; }
        #btn-reset:hover { background-color: #c82333; }
        
        .delay-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .delay-container input { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        
        #status-label { font-size: 13px; font-weight: bold; margin-bottom: 10px; color: #005F9E; min-height: 18px; }
        
        #result-box { padding: 10px; background-color: #f1f1f1; border-left: 4px solid #005F9E; min-height: 40px; max-height: 250px; overflow-y: auto; scroll-behavior: smooth; }
        .group-item { margin-bottom: 8px; padding: 8px; border-bottom: 1px solid #ddd; background-color: white; border-radius: 4px; }
        .group-item.active { background-color: #d4edda; border-left: 4px solid #28a745; }
        .group-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-label">Ready.</div>
    
    <label for="paramName">Sequence Parameter (e.g. ORDER):</label>
    <input type="text" id="paramName" value="ORDER">
    
    <button id="getValueBtn" class="btn-main">Fetch & Group Data</button>
    
    <div class="delay-container">
        <label for="delayInput" style="margin-bottom: 0;">Step Delay (ms):</label>
        <input type="number" id="delayInput" min="50" max="5000" step="50" value="500">
    </div>
    
    <div class="btn-group">
        <button id="btn-simulate" class="btn-sim" disabled>Simulate</button>
        <button id="btn-reset" class="btn-sim" disabled>Reset View</button>
    </div>
    
    <div id="result-box">Select elements in model and click Fetch.</div>
</div>

<script type="module">
    import * as WorkspaceAPI from 'https://esm.sh/trimble-connect-workspace-api';

    let tcAPI = null;
    let globalGroupedResults = []; 
    let simInterval = null;
    let currentStep = 0;

    // 1. Connect to API
    async function initExtension() {
        try {
            tcAPI = await WorkspaceAPI.connect(window.parent, (event, args) => {});
            document.getElementById('status-label').innerText = "✅ API Connected. Select elements.";
        } catch (error) {
            console.error("Connection Failed", error);
            document.getElementById('status-label').innerText = "❌ Connection Failed";
            document.getElementById('status-label').style.color = "red";
        }
    }

    // 2. Recursive Parameter Search
    function findParameterValue(propertiesData, paramName) {
        let foundValue = null;
        const targetName = paramName.toLowerCase();
        const searchObj = (obj) => {
            if (foundValue !== null) return;
            if (typeof obj !== 'object' || obj === null) return;
            if (obj.name && String(obj.name).toLowerCase() === targetName && obj.value !== undefined) {
                foundValue = obj.value; return;
            }
            for (const key in obj) {
                if (key.toLowerCase() === targetName) { foundValue = obj[key]; return; }
                if (typeof obj[key] === 'object') searchObj(obj[key]);
            }
        };
        searchObj(propertiesData);
        return foundValue;
    }

    // 3. Apply Visibility 
    // Uses alpha channel because native "visible: false" is often overridden by Viewer bugs
    async function applyVisibility(items, isVisible) {
        if (!items || items.length === 0 || !tcAPI) return;
        
        const models = {};
        items.forEach(item => {
            if (!models[item.modelId]) models[item.modelId] = [];
            models[item.modelId].push(item.id);
        });
        
        const selectorArray = [];
        for (const mId in models) {
            selectorArray.push({ modelId: mId, objectRuntimeIds: models[mId] });
        }
        
        try {
            if (!isVisible) {
                // Hide: Transparent
                await tcAPI.viewer.setObjectState(selectorArray, { color: { r: 200, g: 200, b: 200, a: 0.0 } });
            } else {
                // Show: Reset to original material color
                await tcAPI.viewer.setObjectState(selectorArray, { color: "reset" });
            }
        } catch (e) {
            console.error("Visibility change failed", e);
        }
    }

    // --- SIMULATION LOGIC ---

    async function startSimulation() {
        if (globalGroupedResults.length === 0) return;
        
        document.getElementById('btn-simulate').disabled = true;
        document.getElementById('getValueBtn').disabled = true;
        
        clearInterval(simInterval);
        currentStep = 0;
        
        document.getElementById('status-label').innerText = "Hiding all objects...";
        
        // Clear selection robustly to drop yellow highlights
        try { await tcAPI.viewer.setSelection([]); } catch(e) {}
        
        // Wait briefly for viewer to drop selection, then hide all valid items
        setTimeout(async () => {
            let allItems = [];
            globalGroupedResults.forEach(g => allItems = allItems.concat(g.items));
            await applyVisibility(allItems, false);
            
            // Start stepping through the groups
            const delay = parseInt(document.getElementById('delayInput').value) || 500;
            simInterval = setInterval(() => { stepSimulation(); }, delay);
            stepSimulation(); // trigger first immediately
            
        }, 300);
    }

    async function stepSimulation() {
        if (currentStep < globalGroupedResults.length) {
            const group = globalGroupedResults[currentStep];
            
            document.getElementById('status-label').innerText = `Showing Step ${currentStep + 1}/${globalGroupedResults.length} (ORDER: ${group.key})...`;
            
            // Highlight UI
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
            const uiEl = document.getElementById(`group-${currentStep}`);
            if (uiEl) {
                uiEl.classList.add('active');
                uiEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Show the items in this group
            await applyVisibility(group.items, true);
            
            currentStep++;
        } else {
            clearInterval(simInterval);
            document.getElementById('status-label').innerText = "Simulation completed.";
            document.getElementById('btn-simulate').disabled = false;
            document.getElementById('getValueBtn').disabled = false;
        }
    }

    async function resetView() {
        clearInterval(simInterval);
        document.getElementById('btn-simulate').disabled = false;
        document.getElementById('getValueBtn').disabled = false;
        
        document.getElementById('status-label').innerText = "View reset to normal.";
        document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
        
        // Restore visibility to all tracked items
        let allItems = [];
        globalGroupedResults.forEach(g => allItems = allItems.concat(g.items));
        await applyVisibility(allItems, true);
        
        try { await tcAPI.viewer.setSelection([]); } catch(e) {}
    }

    // --- FETCH & GROUP DATA ---
    document.getElementById('getValueBtn').addEventListener('click', async () => {
        const resultBox = document.getElementById('result-box');
        if (!tcAPI) { resultBox.innerText = "Error: API not connected."; return; }

        const paramName = document.getElementById('paramName').value.trim();
        if (!paramName) { resultBox.innerText = "Please provide a parameter name."; return; }

        document.getElementById('status-label').innerText = "Collecting assemblies...";
        
        try {
            const selection = await tcAPI.viewer.getSelection();
            if (!selection || selection.length === 0 || selection.every(sel => sel.objectRuntimeIds.length === 0)) {
                resultBox.innerText = "No objects selected. Please select items in the model first.";
                return;
            }

            let resultsArray = [];

            for (const sel of selection) {
                const modelId = sel.modelId;
                if (sel.objectRuntimeIds && sel.objectRuntimeIds.length > 0) {
                    const propertiesList = await tcAPI.viewer.getObjectProperties(modelId, sel.objectRuntimeIds);
                    if (propertiesList && propertiesList.length > 0) {
                        propertiesList.forEach((objectData, index) => {
                            const value = findParameterValue(objectData, paramName);
                            if (value !== null && value !== undefined) {
                                resultsArray.push({ modelId: modelId, id: sel.objectRuntimeIds[index], value: value });
                            }
                        });
                    }
                }
            }

            if (resultsArray.length === 0) {
                resultBox.innerText = `Parameter "${paramName}" not found on selected objects.`;
                document.getElementById('status-label').innerText = "No valid data found.";
                return;
            }

            // Group by Parameter Value
            const groupsMap = {};
            resultsArray.forEach(item => {
                const key = String(item.value);
                if (!groupsMap[key]) groupsMap[key] = [];
                groupsMap[key].push(item);
            });

            // Sort Groups Ascending
            const sortedKeys = Object.keys(groupsMap).sort((a, b) => {
                const numA = Number(a), numB = Number(b);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return a.localeCompare(b);
            });

            globalGroupedResults = sortedKeys.map(k => ({ key: k, items: groupsMap[k] }));

            // Render UI
            resultBox.innerHTML = `<strong>Sequence Groups (${globalGroupedResults.length} steps):</strong><br><br>`;
            globalGroupedResults.forEach((group, idx) => {
                resultBox.innerHTML += `<div class="group-item" id="group-${idx}"><strong>${paramName}: ${group.key}</strong> <span style="float:right; color:#666; font-size:12px;">(${group.items.length} parts)</span></div>`;
            });

            document.getElementById('btn-simulate').disabled = false;
            document.getElementById('btn-reset').disabled = false;
            document.getElementById('status-label').innerText = `Ready to simulate ${globalGroupedResults.length} steps.`;

        } catch (error) {
            console.error("API Error:", error);
            resultBox.innerText = "Error fetching properties.";
        }
    });

    document.getElementById('btn-simulate').addEventListener('click', startSimulation);
    document.getElementById('btn-reset').addEventListener('click', resetView);
    window.onload = initExtension;
</script>

</body>
</html>
