<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4D Construction Sequence Simulator</title>
  <!-- Official IIFE Trimble Connect Workspace API -->
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  <style>
    :root {
      --bg: #0f1720;
      --panel: #17202b;
      --panel-2: #1d2836;
      --border: #2b3b4d;
      --text: #e8eef5;
      --muted: #93a4b8;
      --accent: #1a8cff;
      --accent-2: #0ea5e9;
      --good: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 0% 0%, #1b2d44 0%, var(--bg) 55%);
      color: var(--text);
    }

    .app {
      min-height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      background: #0d141c;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="range"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26, 140, 255, 0.2);
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 650;
      cursor: pointer;
      color: #fff;
      background: #334155;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary { background: linear-gradient(180deg, var(--accent) 0%, #1066c7 100%); flex: 1; }
    .btn-play { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); flex: 1; }
    .btn-pause { background: linear-gradient(180deg, #d97706 0%, #b45309 100%); flex: 1; }
    .btn-reset { background: linear-gradient(180deg, #64748b 0%, #475569 100%); flex: 1; }

    .phase-box {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .phase-value {
      font-size: 28px;
      font-weight: 750;
      color: #7dd3fc;
    }

    .meta {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error { color: #fca5a5; }
    .status.ok { color: #86efac; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-2);
    }

    .speed-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .progress {
      height: 6px;
      background: #0d141c;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-2), #22c55e);
      transition: width 0.2s ease;
    }

    .legend {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .badge-pending { background: #93a4b8; opacity: 0.4; }
    .badge-current { background: #f59e0b; }
    .badge-completed { background: #22c55e; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>4D Sequence Simulator</h1>
      <div class="subtitle">Trimble Connect 3D Viewer side-panel extension</div>
    </header>

    <section class="card">
      <label for="parameterName">Parameter Name</label>
      <input id="parameterName" type="text" value="ORDER" autocomplete="off" />
      <div class="row" style="margin-top: 10px;">
        <button id="loadBtn" class="btn-primary" type="button">Load Data</button>
      </div>
      <div id="loadMeta" class="meta">Connect to the viewer, then load objects grouped by the parameter above.</div>
    </section>

    <section class="card">
      <div class="phase-box">
        <div>
          <label>Current Phase</label>
          <div class="phase-value" id="currentPhase">—</div>
        </div>
        <div class="status" id="playbackStatus">Idle</div>
      </div>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      
      <!-- Legend for sequence color states -->
      <div class="legend">
        <div class="legend-item"><span class="legend-badge badge-pending">
