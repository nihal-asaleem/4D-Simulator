<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect Parameter Simulator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 350px;
        }
        label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 10px; background-color: #005F9E; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-main:hover { background-color: #004573; }
        #result-box { margin-top: 15px; padding: 10px; background-color: #f1f1f1; border-left: 4px solid #005F9E; word-break: break-all; min-height: 40px; max-height: 200px; overflow-y: auto; scroll-behavior: smooth; }
        .status { font-size: 12px; color: #666; margin-bottom: 10px; }
        
        /* Added cursor pointer and hover effect for clickable list items */
        .result-item { margin-bottom: 8px; padding: 8px; border-bottom: 1px solid #ddd; transition: background-color 0.2s; border-radius: 4px; cursor: pointer; }
        .result-item:hover { background-color: #e2e6ea; }
        .result-item:last-child { border-bottom: none; margin-bottom: 0; }
        
        #sim-controls { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #ccc; }
        .sim-btn-group { display: flex; gap: 5px; margin-top: 10px; }
        .sim-btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        #btn-play { background-color: #28a745; } #btn-play:hover { background-color: #218838; }
        #btn-pause { background-color: #ffc107; color: #333; } #btn-pause:hover { background-color: #e0a800; }
        #btn-reset { background-color: #dc3545; } #btn-reset:hover { background-color: #c82333; }
        input[type="range"] { width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="status" id="status-text">Connecting to Trimble Connect...</div>
    <label for="paramName">IFC Parameter Name:</label>
    <input type="text" id="paramName" placeholder="e.g. Volume, Reference, etc.">
    <button id="getValueBtn" class="btn-main">Get & Sort Parameter</button>
    <div id="result-box">Select elements and search...</div>

    <!-- Simulation Controls -->
    <div id="sim-controls">
        <label>Playback Speed: <span id="speed-val">0.5</span>s / step</label>
        <input type="range" id="sim-speed" min="0.1" max="3" step="0.1" value="0.5">
        <div class="sim-btn-group">
            <button id="btn-play" class="sim-btn">Play</button>
            <button id="btn-pause" class="sim-btn">Pause</button>
            <button id="btn-reset" class="sim-btn">Reset</button>
        </div>
    </div>
</div>

<script type="module">
    import * as WorkspaceAPI from 'https://esm.sh/trimble-connect-workspace-api';

    let tcAPI = null;
    let globalSortedResults = []; 
    let simInterval = null;
    let currentIndex = 0;

    // 1. Connect to API
    async function initExtension() {
        try {
            tcAPI = await WorkspaceAPI.connect(window.parent, (event, args) => {});
            document.getElementById('status-text').innerText = "✅ API Connected";
            document.getElementById('status-text').style.color = "green";
        } catch (error) {
            console.error("Connection Failed", error);
            document.getElementById('status-text').innerText = "❌ Connection Failed";
            document.getElementById('status-text').style.color = "red";
        }
    }

    // 2. Recursive Search
    function findParameterValue(propertiesData, paramName) {
        let foundValue = null;
        const targetName = paramName.toLowerCase();
        const searchObj = (obj) => {
            if (foundValue !== null) return;
            if (typeof obj !== 'object' || obj === null) return;
            if (obj.name && String(obj.name).toLowerCase() === targetName && obj.value !== undefined) {
                foundValue = obj.value; return;
            }
            for (const key in obj) {
                if (key.toLowerCase() === targetName) { foundValue = obj[key]; return; }
                if (typeof obj[key] === 'object') searchObj(obj[key]);
            }
        };
        searchObj(propertiesData);
        return foundValue;
    }

    // 3. Centralized State Manager (Hidden, Yellow, or Green)
    async function applyState(items, stateType) {
        if (!items || items.length === 0 || !tcAPI) return;
        
        const models = {};
        items.forEach(item => {
            if (!models[item.modelId]) models[item.modelId] = [];
            models[item.modelId].push(item.id);
        });
        
        const selectorArray = [];
        for (const mId in models) {
            selectorArray.push({ modelId: mId, objectRuntimeIds: models[mId] });
        }
        
        try {
            if (stateType === "hidden") {
                await tcAPI.viewer.setObjectState(selectorArray, { visible: false });
            } else if (stateType === "active") {
                // Active Step: Visible + Yellow
                await tcAPI.viewer.setObjectState(selectorArray, { visible: true, color: { r: 255, g: 255, b: 0, a: 1.0 } });
            } else if (stateType === "done") {
                // Finished Step: Visible + Green
                await tcAPI.viewer.setObjectState(selectorArray, { visible: true, color: { r: 40, g: 167, b: 69, a: 1.0 } });
            }
        } catch (e) { 
            console.error("Failed to set visibility state", e); 
        }
    }

    // --- SIMULATION LOGIC ---

    async function resetSimulation() {
        pauseSimulation();
        currentIndex = 0;
        
        // Hide ALL valid elements 
        await applyState(globalSortedResults, "hidden");

        // Clear UI highlights
        document.querySelectorAll('.result-item').forEach(el => {
            el.style.backgroundColor = 'transparent';
        });
        document.getElementById('result-box').scrollTop = 0;
    }

    function playSimulation() {
        if (simInterval || globalSortedResults.length === 0) return;
        
        // Clear selection just in case user clicked something before hitting play
        tcAPI.viewer.setSelection([]);

        const speedMs = parseFloat(document.getElementById('sim-speed').value) * 1000;
        simInterval = setInterval(() => { stepSimulation(); }, speedMs);
        stepSimulation(); 
    }

    function pauseSimulation() {
        if (simInterval) { clearInterval(simInterval); simInterval = null; }
    }

    async function stepSimulation() {
        // 1. Turn previous element Green (Finished)
        if (currentIndex > 0) {
            const prevItem = globalSortedResults[currentIndex - 1];
            await applyState([prevItem], "done"); 
            
            const prevEl = document.getElementById(`item-${prevItem.id}`);
            if (prevEl) prevEl.style.backgroundColor = '#d4edda'; 
        }
        
        // 2. Turn current element Yellow (Active) and scroll list
        if (currentIndex < globalSortedResults.length) {
            const currItem = globalSortedResults[currentIndex];
            await applyState([currItem], "active"); 
            
            const currEl = document.getElementById(`item-${currItem.id}`);
            if (currEl) {
                currEl.style.backgroundColor = '#fff3cd'; 
                currEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            currentIndex++;
        } else {
            pauseSimulation(); // Stop at the end
        }
    }

    // --- BIND CLICKS TO RESULT LIST ---
    function bindListClicks() {
        document.querySelectorAll('.result-item').forEach(el => {
            el.addEventListener('click', async (e) => {
                const objId = parseInt(e.currentTarget.getAttribute('data-id'));
                const modId = e.currentTarget.getAttribute('data-model');
                
                if (!isNaN(objId) && modId) {
                    pauseSimulation();
                    // Explicitly command API to select ONLY this one specific element
                    await tcAPI.viewer.setSelection([{ modelId: modId, objectRuntimeIds: [objId] }]);
                }
            });
        });
    }

    // --- EVENT LISTENERS ---
    
    document.getElementById('sim-speed').addEventListener('input', function() { document.getElementById('speed-val').innerText = parseFloat(this.value).toFixed(1); });
    document.getElementById('sim-speed').addEventListener('change', function() { if (simInterval) { pauseSimulation(); playSimulation(); } });
    document.getElementById('btn-play').addEventListener('click', playSimulation);
    document.getElementById('btn-pause').addEventListener('click', pauseSimulation);
    document.getElementById('btn-reset').addEventListener('click', resetSimulation);

    document.getElementById('getValueBtn').addEventListener('click', async () => {
        const resultBox = document.getElementById('result-box');
        if (!tcAPI) { resultBox.innerText = "Error: API not connected."; return; }

        const paramName = document.getElementById('paramName').value.trim();
        if (!paramName) { resultBox.innerText = "Please type a parameter name."; return; }

        resultBox.innerText = "Fetching and sorting data...";
        pauseSimulation();
        
        try {
            const selection = await tcAPI.viewer.getSelection();
            if (!selection || selection.length === 0 || selection.every(sel => sel.objectRuntimeIds.length === 0)) {
                resultBox.innerText = "No objects selected.";
                document.getElementById('sim-controls').style.display = "none";
                return;
            }

            let resultsArray = [];

            for (const sel of selection) {
                const modelId = sel.modelId;
                if (sel.objectRuntimeIds && sel.objectRuntimeIds.length > 0) {
                    const propertiesList = await tcAPI.viewer.getObjectProperties(modelId, sel.objectRuntimeIds);
                    if (propertiesList && propertiesList.length > 0) {
                        propertiesList.forEach((objectData, index) => {
                            const value = findParameterValue(objectData, paramName);
                            resultsArray.push({ modelId: modelId, id: sel.objectRuntimeIds[index], value: value });
                        });
                    }
                }
            }

            resultsArray.sort((a, b) => {
                const valA = a.value, valB = b.value;
                if (valA == null) return 1;
                if (valB == null) return -1;
                const numA = Number(valA), numB = Number(valB);
                if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                return String(valA).localeCompare(String(valB));
            });

            globalSortedResults = resultsArray.filter(item => item.value !== null && item.value !== undefined);

            resultBox.innerHTML = `<strong>Results for "${paramName}":</strong><br><br>`;
            resultsArray.forEach(item => {
                if (item.value !== null && item.value !== undefined) {
                    resultBox.innerHTML += `<div class="result-item" data-id="${item.id}" data-model="${item.modelId}" id="item-${item.id}" title="Click to isolate in Viewer"><strong>ID ${item.id}:</strong> ${item.value}</div>`;
                } else {
                    resultBox.innerHTML += `<div class="result-item" style="color:red; cursor:default;"><strong>ID ${item.id}:</strong> Not found</div>`;
                }
            });

            // Bind individual selection clicks to the newly created list elements
            bindListClicks();

            if (globalSortedResults.length > 0) {
                document.getElementById('sim-controls').style.display = "block";
                
                // CRUCIAL FIX: Clear selection, wait 300ms for the viewer to render the dropped yellow boxes, THEN hide elements.
                await tcAPI.viewer.setSelection([]);
                setTimeout(async () => {
                    await resetSimulation();
                }, 300);

            } else {
                document.getElementById('sim-controls').style.display = "none";
                resultBox.innerHTML += `<br><em>No valid data to simulate.</em>`;
            }

        } catch (error) {
            console.error("API Error:", error);
            resultBox.innerText = "Error fetching properties.";
        }
    });

    window.onload = initExtension;
</script>

</body>
</html>
